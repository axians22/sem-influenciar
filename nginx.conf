server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # JS e CSS saem do Vite com hash no nome: podem ficar em cache para sempre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # fichas dos deputados, regeneradas por scripts/deputados.py
  location /tse/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # o index.html nunca fica em cache, para um novo deploy aparecer na hora.
  # As abas ficam no hash (#/pesquisas), então não é preciso reescrever rotas.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
